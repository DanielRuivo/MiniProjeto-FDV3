<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tela de Login</title>
  <link rel="stylesheet" href="/CSS/cadastro_login.css" />
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="usuarioLogin" placeholder="Usuário" required /><br />
      <input type="password" id="senhaLogin" placeholder="Senha" required /><br /><br />
      <button type="submit">Entrar</button>
    </form>

    <div id="mensagem"></div>
    <br />
    <p>Não tem uma conta? <a href="pagina_reflorestamento.html">Cadastre-se</a></p>
  </div>

  <script src="/JS/tela_de_login.js"></script>
</body>
</html>
