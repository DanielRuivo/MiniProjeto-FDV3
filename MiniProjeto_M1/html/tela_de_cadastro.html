<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tela de Cadastro</title>
  </head>
  <body>
    <div class="container">
      <form id="formulario">
        <input type="text" id="usuario" placeholder="Usuário" /><br />
        <input type="password" id="senha" placeholder="Senha" /><br />
        <div id="radio-grup">
          <label
            ><input
              type="radio"
              name="arvore"
              value="pau-brasil"
              checked />Pau-Brasil<br
          /></label>
          <label
            ><input
              type="radio"
              name="arvore"
              value="castanheira" />Castanheira<br
          /></label>
          <label
            ><input
              type="radio"
              name="arvore"
              value="peroba-rosa" />Peroba-Rosa<br
          /></label>
        </div>
        <button id="botao" type="submit">Enviar</button>
      </form>
    </div>
  </body>
</html>
