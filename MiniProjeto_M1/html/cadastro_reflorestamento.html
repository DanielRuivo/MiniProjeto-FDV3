<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro Realizado</title>
  </head>
  <body>
    <div class="container">
      <input
        type="number"
        id="numero"
        placeholder="Número de árvores plantadas"
      /><br /><br />
      <label for="arvore">Escolha uma árvore:</label><br />
      <select id="arvore">
        <option value="nenhum">Nenhum</option>
        <option value="ipes">Ipês</option>
        <option value="angicos">Angicos</option>
        <option value="aroeiras">Aroeiras</option>
        <option value="jequiibas">Jequitibás</option>
        <option value="perobaDoCampo">Peroba do campo</option></select
      ><br />
      <div id="mensagem"></div><br>
      <button type="submit">Enviar</button>
    </div>
  </body>
</html>
<script src="/JS/cadastro_reflorestamento.js"></script>
